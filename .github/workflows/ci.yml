name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Native platform folders are not committed; generate them for build.
      - run: flutter create . --platforms=web
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
