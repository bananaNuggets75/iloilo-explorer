name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .env.local is git-ignored (holds secrets) but is a declared asset, so
      # CI must provide the file for analyze/build. Empty → isConfigured is
      # false and the app runs on bundled seed data, which is what CI verifies.
      - run: touch .env.local
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Native platform folders are not committed; generate them for build.
      - run: flutter create . --platforms=web
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
