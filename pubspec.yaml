name: iloilo_travel_buddy
description: SuroyIloilo — a local travel companion for Iloilo City. Places, food, jeepney routes with fares, day plans, events, and traveler tips.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  http: ^1.2.0
  share_plus: ^10.0.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env.local
